<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修改默认口令 - AgentCapture</title>
<style>
  :root { --neon: #3b82f6; --neon-2: #22d3ee; --text: #eaf3ff; --muted: #8fa9d8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    color: var(--text);
    font-family: "Fira Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #030a1c url('/static/login-bg.jpg') center / cover no-repeat fixed;
  }
  .card {
    position: relative; width: min(520px, 100%);
    border: 1px solid rgba(59, 130, 246, 0.55);
    border-radius: 4px;
    padding: 40px 38px 34px;
    background: linear-gradient(180deg, rgba(8, 20, 44, 0.9), rgba(3, 10, 26, 0.94));
    box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.10), 0 0 44px rgba(37, 99, 235, 0.22), inset 0 0 60px rgba(37, 99, 235, 0.08);
  }
  .corner { position: absolute; width: 24px; height: 24px; border-color: var(--neon-2); border-style: solid; border-width: 0; }
  .corner.tl { top: -2px; left: -2px; border-top-width: 2.5px; border-left-width: 2.5px; }
  .corner.tr { top: -2px; right: -2px; border-top-width: 2.5px; border-right-width: 2.5px; }
  .corner.bl { bottom: -2px; left: -2px; border-bottom-width: 2.5px; border-left-width: 2.5px; }
  .corner.br { bottom: -2px; right: -2px; border-bottom-width: 2.5px; border-right-width: 2.5px; }
  h1 { margin: 0; font-size: 21px; letter-spacing: .04em; }
  h1 span { color: var(--neon-2); }
  .sub { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 10px 0 22px; }
  .error {
    margin-bottom: 16px;
    border: 1px solid rgba(251, 113, 133, 0.35);
    background: rgba(251, 113, 133, 0.10);
    color: #fecdd3;
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 13px; font-weight: 600;
  }
  form { display: grid; gap: 14px; }
  input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 8px;
    border: 1px solid rgba(96, 165, 250, 0.35);
    background: rgba(5, 14, 32, 0.72);
    color: var(--text);
    font: inherit; font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--neon-2); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.14); }
  button {
    width: 100%;
    border: 0; border-radius: 8px;
    padding: 13px;
    font: inherit; font-size: 15px; font-weight: 800; letter-spacing: .3em; text-indent: .3em;
    color: #fff;
    background: linear-gradient(180deg, #2f7cf6, #1d5fe0);
    box-shadow: 0 10px 30px rgba(29, 95, 224, 0.45);
    cursor: pointer;
  }
  button:hover { filter: brightness(1.07); }
  .policy { color: var(--muted); font-size: 12px; line-height: 1.8; margin: 0; }
  .policy b { color: #bcd6f7; }
  .user { color: var(--muted); font-size: 12px; margin-top: 14px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  <h1>修改<span>默认口令</span></h1>
  <p class="sub">检测到当前仍在使用<b>出厂默认口令</b>。为保障平台安全，请设置新的管理员密码后方可继续使用系统。</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="">
    <input type="password" name="password" placeholder="新密码" required autocomplete="new-password">
    <input type="password" name="confirm" placeholder="确认新密码" required autocomplete="new-password">
    <p class="policy">复杂度要求：<b>至少 8 位</b>，且同时包含<b>大写字母、小写字母、数字与符号</b>。</p>
    <button type="submit">确认修改</button>
  </form>
  <div class="user">账号：{{ username }}</div>
</div>
</body>
</html>
