[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-capture-honeypot"
version = "0.5.0"
license = "AGPL-3.0-or-later"
description = "Embedded honeypot and agent-detection platform for AI-driven web probing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "jinja2>=3.1.4",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "psutil>=6.0.0",
  "itsdangerous>=2.2.0",
  "httpx>=0.27.0",
  "paramiko>=3.4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0"
]
clone = [
  "playwright>=1.40.0"
]
pg = [
  "psycopg[binary]>=3.1"
]
msf = [
  "msgpack>=1.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
